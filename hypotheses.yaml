schema_version: 0.3.0
canon_version: V7.0
hypotheses:
- id: L1-H1
  scope: layer
  layer: L1
  status: registered
  claim: 120 粒子转为 12 节点需含名称+定义+边，能降低认知负荷
  operational_definition: 节点数 12，每节点含 name/definition/edges 三字段；认知负荷用 NASA-TLX 测量。
  baseline: 原文组（无结构）
  control: 结构化组（12 节点）
  sample_unit: participant
  metric:
    name: NASA-TLX
    direction: decrease
  threshold:
    min_effect: 0.15
    alpha: 0.05
  exclusion_rules:
  - 阅读时间 < 10s
  - 阅读时间 > 10min
  analysis:
    method: paired_t
    pairing_key: participant_id
  falsifier: 结构化组 NASA-TLX 下降 < 15%，或方向相反且 p < 0.05
  inconclusive_if:
  - missing:
    - treatment_data
    - control_data
  - n: < 30
    source: pilot_power_analysis
    registered_at: '2026-10-18'
  - metric_not_observed: true
  toolkit_ref: toolkit/nasa_tlx/
  evidence_ceiling: E2
- id: L3-H1
  scope: layer
  layer: L3
  status: draft
  claim: 方向·价值·边界三角分桶能提升意义生成一致性
  operational_definition: 三角分桶标注一致性用 Krippendorff's alpha
  baseline: 无分桶（平面分类）
  control: 三角分桶
  sample_unit: annotation_item
  metric:
    name: krippendorff_alpha
    direction: increase
  threshold:
    min_alpha: 0.67
  exclusion_rules:
  - 标注者 < 2 的 item 剔除
  analysis:
    method: alpha_with_bootstrap
    n_boot: 1000
  falsifier: 三角分桶 alpha < 0.67
  inconclusive_if:
  - missing:
    - rater_id
    - item_id
    - category
  - n_raters: < 2
  toolkit_ref: toolkit/krippendorff_alpha/
  evidence_ceiling: E1
- id: L5-H1
  scope: layer
  layer: L5
  status: draft
  claim: 五尺度方向选择优于单尺度
  operational_definition: 方向选择质量 = 与专家排序的 Brier 分数
  baseline: 单尺度
  control: 五尺度
  sample_unit: decision_case
  metric:
    name: brier_score
    direction: decrease
  threshold:
    max_brier: 0.2
  exclusion_rules:
  - 专家排序缺失的 case 剔除
  analysis:
    method: brier_with_ci
    ci: 0.95
  falsifier: 五尺度 Brier > 0.2 或不优于单尺度
  inconclusive_if:
  - missing:
    - without_ring_scores
    - with_ring_scores
    - ground_truth
  - n: < 20
  toolkit_ref: toolkit/brier/
  evidence_ceiling: E1
- id: L2-H1
  scope: layer
  layer: L2
  status: draft
  claim: 可操作控件优于静态阅读
  operational_definition: 操作完成率与理解测试分数
  baseline: 静态阅读
  control: 可操作控件
  sample_unit: participant
  metric:
    name: comprehension_score
    direction: increase
  threshold:
    min_effect: 0.2
  exclusion_rules: []
  analysis:
    method: paired_t
  falsifier: 控件组理解分不高于静态组
  inconclusive_if:
  - missing:
    - treatment_data
    - control_data
  toolkit_ref: toolkit/comprehension/
  evidence_ceiling: E1
- id: L4-H1
  scope: layer
  layer: L4
  status: draft
  claim: E0-E6 证据色环能提升判断校准
  operational_definition: 判断校准用 Brier 分数
  baseline: 无证据标注
  control: E0-E6 色环
  sample_unit: judgment
  metric:
    name: brier_score
    direction: decrease
  threshold:
    max_brier: 0.2
  exclusion_rules: []
  analysis:
    method: brier_with_ci
  falsifier: 色环组 Brier 不低于无标注组
  inconclusive_if:
  - missing:
    - scores
    - ground_truth
  toolkit_ref: toolkit/brier/
  evidence_ceiling: E2
- id: L6-H1
  scope: layer
  layer: L6
  status: draft
  claim: 递归反思能发现单层遗漏的前提
  operational_definition: 遗漏前提发现率（人工评审）
  baseline: 无递归
  control: max_depth=3 递归
  sample_unit: review_case
  metric:
    name: missed_premise_rate
    direction: decrease
  threshold:
    min_effect: 0.2
  exclusion_rules:
  - 递归未达 max_depth 的 case 剔除
  analysis:
    method: paired_t
  falsifier: 递归组遗漏率不降低
  inconclusive_if:
  - missing:
    - recursive_data
    - baseline_data
  toolkit_ref: toolkit/review/
  evidence_ceiling: E1
- id: S-H1
  scope: stack
  status: draft
  claim: 六层联合（full_stack）在 value_assessment_coherence 上优于移除 L3 的消融变体（ABL-L3），效应量不低于
    δ=0.3。
  operational_definition: value_assessment_coherence = L4 输出与人工标注的一致性（Krippendorff's
    alpha，多标注者）；整栈以 run 为单位，同一 input_id 下 full_stack 与 ABL-L3 配对执行。
  baseline:
    ref: config.json#/control_loop/ablation/ABL-L3
  control: full_stack
  sample_unit: run
  metric:
    name: value_assessment_coherence
    statistic: krippendorff_alpha
    direction: increase
  threshold:
    min_effect_size: 0.3
    alpha: 0.05
  exclusion_rules:
  - input_id 在 full_stack 或 ABL-L3 任一缺失的配对整体剔除
  - alpha 计算标注者 < 2 的 run 剔除
  analysis:
    design: paired
    method: wilcoxon_signed_rank
    pairing_key: input_id
    multiple_comparison: holm
  design: within-input A/B；pilot 阶段做功效分析定 min_n，预注册后冻结；正式实验按配对设计跑 full_stack vs ABL-L3。
  falsifier: 配对检验下 full_stack 相对 ABL-L3 效应量 < 0.3，或方向相反且 p < 0.05。
  inconclusive_if:
  - n: < 40
    source: pilot_power_analysis
    registered_at: null
    effect_size_assumed: 0.3
    alpha: 0.05
    power: 0.8
  - missing:
    - full_stack_data
    - ablation_data
  - metric_not_observed: true
  toolkit_ref: toolkit/krippendorff_alpha/
  evidence_ceiling: E3
