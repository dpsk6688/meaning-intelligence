# ============================================================================
# 统计标准说明
# ============================================================================
statistical_conventions:
  note: >
    正典使用 d < 0.3 / p > 0.05 作为证伪条件。B2 阶段将改写为等效性检验
    （见 docs/equivalence-tests.md）。
  current:
    effect_size_threshold: 0.3
    alpha: 0.05
    power_min: 0.80   # 仅在 H1 中显式给出
  planned_equivalence_standard: "见 docs/equivalence-tests.md"