<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MI 日常助手 | 个人意义智能自检</title>
    <style>
        :root { --bg: #0f1115; --panel: #1a1d24; --text: #e2e8f0; --accent: #3b82f6; --border: #2d3748; --success: #10b981; --purple: #8b5cf6; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 80px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        h1 { font-weight: 300; letter-spacing: 1px; font-size: 1.4rem; margin: 0; }
        .header-btns { display: flex; gap: 8px; }
        .icon-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
        .scene-selector { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
        .scene-btn { flex: 1; min-width: 100px; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; white-space: nowrap; }
        .scene-btn.active { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); color: var(--accent); font-weight: bold; }
        .step-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; transition: all 0.3s; }
        .step-card.disabled { opacity: 0.3; pointer-events: none; }
        .layer-badge { background: var(--accent); color: #fff; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: bold; margin-right: 10px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; color: #94a3b8; margin-bottom: 6px; }
        input[type="text"], textarea { width: 100%; background: #0f1115; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; font-size: 1rem; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent); }
        textarea { resize: vertical; min-height: 100px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background 0.2s; flex: 1; }
        button:hover { background: #2563eb; }
        .btn-ai { background: var(--purple); }
        .btn-ai:hover { background: #7c3aed; }
        .btn-ai:disabled { background: var(--border); cursor: wait; }
        .result-box { background: #1e293b; border-left: 4px solid var(--success); padding: 20px; border-radius: 8px; margin-top: 20px; white-space: pre-wrap; font-size: 0.95rem; }
        .tip { font-size: 0.85rem; color: #64748b; font-style: italic; margin-top: 8px; }
        .drawer { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100vh; background: var(--panel); box-shadow: -5px 0 15px rgba(0,0,0,0.5); transition: right 0.3s ease; z-index: 1000; padding: 20px; overflow-y: auto; }
        .drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }
        .history-item { background: #0f1115; border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; }
        .history-date { font-size: 0.75rem; color: #64748b; margin-bottom: 5px; }
        .history-text { font-size: 0.9rem; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--panel); padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid var(--border); }
        .modal h3 { margin-top: 0; color: var(--accent); }
        .modal select, .modal input { width: 100%; padding: 10px; margin-bottom: 15px; background: #0f1115; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <a href="../" style="color: #64748b; text-decoration: none; font-size: 0.9rem; display: block; margin-bottom: 5px;">← 返回项目主页</a>
            <h1>🧭 MI 日常助手</h1>
        </div>
        <div class="header-btns">
            <button class="icon-btn" onclick="openSettings()">⚙️ AI 设置</button>
            <button class="icon-btn" onclick="toggleDrawer()">📁 历史</button>
        </div>
    </div>
    <div class="scene-selector">
        <div class="scene-btn active" onclick="switchScene('work', this)">💼 工作复盘</div>
        <div class="scene-btn" onclick="switchScene('study', this)">📚 学习卡点</div>
        <div class="scene-btn" onclick="switchScene('life', this)">🌱 人生选择</div>
    </div>
    <div class="step-card" id="stepL1">
        <h2><span class="layer-badge">L1 减负</span> <span id="sceneTitle">工作复盘</span></h2>
        <div class="input-group">
            <label id="scenePrompt">今天的工作中，让你感到最内耗或卡住的事情是什么？</label>
            <textarea id="rawInput" placeholder="在这里倾诉，AI 会帮你理清思路..."></textarea>
        </div>
        <div class="btn-group">
            <button class="btn-ai" id="btnAI" onclick="processAI()">✨ AI 自动拆解</button>
            <button onclick="processL1()">手动拆解</button>
        </div>
        <p class="tip">提示：首次使用请点击右上角“⚙️ AI 设置”配置模型。</p>
    </div>
    <div class="step-card disabled" id="stepL2L3">
        <h2><span class="layer-badge">L2-3 可体验</span> 明确方向、价值与边界</h2>
        <div class="grid">
            <div>
                <h3 style="color:#cbd5e1; margin-bottom:10px;">路径 A</h3>
                <div class="input-group"><label>方向</label><input type="text" id="dirA"></div>
                <div class="input-group"><label>价值</label><input type="text" id="valA"></div>
                <div class="input-group"><label>边界</label><input type="text" id="boundA"></div>
            </div>
            <div>
                <h3 style="color:#cbd5e1; margin-bottom:10px;">路径 B</h3>
                <div class="input-group"><label>方向</label><input type="text" id="dirB"></div>
                <div class="input-group"><label>价值</label><input type="text" id="valB"></div>
                <div class="input-group"><label>边界</label><input type="text" id="boundB"></div>
            </div>
        </div>
        <button onclick="processL3()" style="width: 100%;">生成自检报告并保存</button>
    </div>
    <div class="step-card disabled" id="stepL5L6">
        <h2><span class="layer-badge">L4-6 评估与反思</span> 最终决定与防线</h2>
        <div class="result-box" id="finalReport"></div>
        <p class="tip" style="margin-top:15px; color:#f59e0b;">注：助手不为你做决定。请阅读上述反思，由你自己选定最终方向。</p>
    </div>
</div>
<div class="drawer" id="historyDrawer">
    <div class="drawer-header"><h2 style="margin:0; font-size:1.2rem;">历史记录</h2><button class="icon-btn" onclick="toggleDrawer()">关闭</button></div>
    <div id="historyList"></div>
</div>
<div class="modal-overlay" id="settingsModal">
    <div class="modal">
        <h3>⚙️ AI 引擎设置</h3>
        <label>引擎类型</label>
        <select id="aiProvider" onchange="toggleProviderConfig()">
            <option value="github">GitHub Models (免费公网)</option>
            <option value="ollama">本地 Ollama (开发者)</option>
        </select>
        <div id="configGithub">
            <label>GitHub Personal Access Token</label>
            <input type="password" id="ghToken" placeholder="github_pat_...">
            <p class="tip">用于调用免费的 gpt-4o-mini。仅需基础权限。</p>
        </div>
        <div id="configOllama" style="display:none;">
            <label>Ollama 模型名称</label>
            <input type="text" id="ollamaModel" value="qwen2.5-coder:7b">
        </div>
        <div class="btn-group" style="margin-top: 25px;">
            <button onclick="saveSettings()">保存设置</button>
            <button onclick="closeSettings()" style="background: var(--border);">取消</button>
        </div>
    </div>
</div>
<script>
    let settings = {
        provider: localStorage.getItem('mi_provider') || 'github',
        ghToken: localStorage.getItem('mi_gh_token') || '',
        ollamaModel: localStorage.getItem('mi_ollama_model') || 'qwen2.5-coder:7b'
    };
    function openSettings() {
        document.getElementById('aiProvider').value = settings.provider;
        document.getElementById('ghToken').value = settings.ghToken;
        document.getElementById('ollamaModel').value = settings.ollamaModel;
        toggleProviderConfig();
        document.getElementById('settingsModal').classList.add('open');
    }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
    function toggleProviderConfig() {
        const p = document.getElementById('aiProvider').value;
        document.getElementById('configGithub').style.display = p === 'github' ? 'block' : 'none';
        document.getElementById('configOllama').style.display = p === 'ollama' ? 'block' : 'none';
    }
    function saveSettings() {
        settings.provider = document.getElementById('aiProvider').value;
        settings.ghToken = document.getElementById('ghToken').value.trim();
        settings.ollamaModel = document.getElementById('ollamaModel').value.trim();
        localStorage.setItem('mi_provider', settings.provider);
        localStorage.setItem('mi_gh_token', settings.ghToken);
        localStorage.setItem('mi_ollama_model', settings.ollamaModel);
        closeSettings();
    }
    async function processAI() {
        const raw = document.getElementById('rawInput').value;
        if(!raw) return alert('请先写下你的困扰，AI 才能帮你拆解哦');
        if (settings.provider === 'github' && !settings.ghToken) {
            alert('请先在右上角【⚙️ AI 设置】中填入免费的 GitHub Token。'); openSettings(); return;
        }
        const btn = document.getElementById('btnAI');
        btn.innerText = "思考中..."; btn.disabled = true;
        const sysPrompt = `你是一个意义智能拆解助手。请提取出两个应对路径。严格按以下 JSON 格式返回，不要其他废话：\n{"A": {"dir": "方向", "val": "价值", "bound": "边界"}, "B": {"dir": "方向", "val": "价值", "bound": "边界"}}`;
        const userPrompt = `用户困扰："${raw}"`;
        try {
            let resultJson = "";
            if (settings.provider === 'ollama') {
                const res = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: settings.ollamaModel, system: sysPrompt, prompt: userPrompt, stream: false, format: 'json' })
                });
                if(!res.ok) throw new Error('Ollama 连接失败');
                const data = await res.json(); resultJson = data.response;
            } else {
                const res = await fetch('https://models.github.ai/inference/chat/completions', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', 'Authorization': `Bearer ${settings.ghToken}` },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [ { role: 'system', content: sysPrompt }, { role: 'user', content: userPrompt } ],
                        response_format: { type: 'json_object' }
                    })
                });
                if(!res.ok) { const err = await res.json(); throw new Error(err.error?.message || 'Token 无效或额度用尽'); }
                const data = await res.json(); resultJson = data.choices[0].message.content;
            }
            const result = JSON.parse(resultJson);
            document.getElementById('dirA').value = result.A.dir; document.getElementById('valA').value = result.A.val; document.getElementById('boundA').value = result.A.bound;
            document.getElementById('dirB').value = result.B.dir; document.getElementById('valB').value = result.B.val; document.getElementById('boundB').value = result.B.bound;
            document.getElementById('stepL2L3').classList.remove('disabled');
            document.getElementById('stepL2L3').scrollIntoView({ behavior: 'smooth' });
        } catch (error) { alert('AI 拆解失败：' + error.message); } finally { btn.innerText = "✨ AI 自动拆解"; btn.disabled = false; }
    }
    const scenes = { work: { title: "工作复盘", prompt: "今天的工作中，让你感到最内耗或卡住的事情是什么？" }, study: { title: "学习卡点", prompt: "在学习新知识或技能时，目前最大的阻碍是什么？" }, life: { title: "人生选择", prompt: "在生活的某个十字路口，你现在面临的纠结是什么？" } };
    function switchScene(key, btn) {
        document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        document.getElementById('sceneTitle').innerText = scenes[key].title; document.getElementById('scenePrompt').innerText = scenes[key].prompt;
        document.getElementById('rawInput').value = ''; document.getElementById('stepL2L3').classList.add('disabled'); document.getElementById('stepL5L6').classList.add('disabled');
    }
    function processL1() {
        if(!document.getElementById('rawInput').value) return alert('请先写下你的困扰');
        document.getElementById('stepL2L3').classList.remove('disabled'); document.getElementById('stepL2L3').scrollIntoView({ behavior: 'smooth' });
    }
    function evaluateEvidence(val, bound) {
        if(!bound) return "E0 (缺乏边界)";
        if(bound.length > 4 && val.length > 4) return "E3 (边界与价值清晰)";
        return "E2 (有止损机制)";
    }
    function processL3() {
        let A = { dir: document.getElementById('dirA').value || "未填", val: document.getElementById('valA').value || "未填", bound: document.getElementById('boundA').value || "" };
        let B = { dir: document.getElementById('dirB').value || "未填", val: document.getElementById('valB').value || "未填", bound: document.getElementById('boundB').value || "" };
        A.ev = evaluateEvidence(A.val, A.bound); B.ev = evaluateEvidence(B.val, B.bound);
        let report = `【L3-L4 结构化对比】\n🅰️ 路径 A：去【${A.dir}】，因为【${A.val}】\n   └ 防御评估: ${A.ev}\n🅱️ 路径 B：去【${B.dir}】，因为【${B.val}】\n   └ 防御评估: ${B.ev}\n\n【L6 递归灵魂拷问】\n1. 如果选 A：当边界【${A.bound || '未设定'}】被打破时，你愿意认输吗？\n2. 如果选 B：当边界【${B.bound || '未设定'}】被打破时，你的 Plan B 是什么？\n3. 假设一年后都失败了，你更能接受哪种“失败”？\n4. 你现在是不敢选 A，还是不想选 B？`;
        document.getElementById('finalReport').innerText = report; document.getElementById('stepL5L6').classList.remove('disabled');
        document.getElementById('stepL5L6').scrollIntoView({ behavior: 'smooth' }); saveToHistory(report);
    }
    function saveToHistory(report) {
        const history = JSON.parse(localStorage.getItem('mi_history') || '[]');
        history.unshift({ id: Date.now(), date: new Date().toLocaleString(), title: document.getElementById('sceneTitle').innerText, raw: document.getElementById('rawInput').value, report: report });
        localStorage.setItem('mi_history', JSON.stringify(history)); renderHistory();
    }
    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('mi_history') || '[]');
        const list = document.getElementById('historyList');
        if(history.length === 0) { list.innerHTML = '<p style="color:#64748b; text-align:center;">暂无历史记录</p>'; return; }
        list.innerHTML = history.map(h => `<div class="history-item" onclick="loadHistory(${h.id})"><div class="history-date">${h.date} · ${h.title}</div><div class="history-text">${h.raw}</div></div>`).join('');
    }
    function loadHistory(id) {
        const history = JSON.parse(localStorage.getItem('mi_history') || '[]');
        const record = history.find(h => h.id === id);
        if(record) {
            document.getElementById('rawInput').value = record.raw; document.getElementById('finalReport').innerText = record.report;
            document.getElementById('stepL5L6').classList.remove('disabled'); toggleDrawer(); document.getElementById('stepL5L6').scrollIntoView({ behavior: 'smooth' });
        }
    }
    function toggleDrawer() { document.getElementById('historyDrawer').classList.toggle('open'); renderHistory(); }
    renderHistory();
</script>
</body>
</html>
