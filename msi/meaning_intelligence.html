<title>Meaning Intelligence</title>
<style>
:root{--bg:#0a0c10;--card:#141820;--cyan:#00e5ff;--purple:#bb86fc;--text:#e0e6ed;--sub:#8b95a5;--border:#2a2f3a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:30px 15px;min-height:100vh}
.app{width:100%;max-width:900px;background:var(--card);border-radius:16px;padding:25px;border:1px solid var(--border);box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 30px rgba(0,229,255,.1);display:flex;flex-direction:column;gap:20px}
header{text-align:center;border-bottom:1px solid var(--border);padding-bottom:15px;position:relative}
h1{font-size:1.8rem;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.subtitle{color:var(--sub);font-size:.9rem}
.lang-btn{position:absolute;right:0;top:0;background:rgba(0,229,255,.08);border:1px solid var(--cyan);color:var(--cyan);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:600}
.lang-btn:hover,.lang-btn:focus-visible{background:var(--cyan);color:#000}
.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--border);color:var(--sub);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem}
.tab:hover{border-color:var(--cyan);color:var(--text)}
.tab[aria-selected=true]{background:rgba(0,229,255,.1);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.2)}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.panel[hidden]{display:none}
.box{background:#0f1218;border-radius:12px;border:1px solid var(--border);padding:15px}
video{width:100%;max-height:480px;border-radius:8px;border:1px solid var(--cyan);background:#000}
.note{color:var(--sub);font-size:.8rem;margin-top:10px;text-align:center}
.warn{color:var(--purple)}
.slider{display:flex;flex-direction:column;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;background:#1f2530;border-radius:4px;outline-offset:6px;margin:15px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--cyan);cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,.6)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--cyan);cursor:pointer}
#stageSlider{width:85%}
.labels{width:85%;display:flex;justify-content:space-between;gap:4px;font-size:.75rem;color:var(--sub)}
.labels button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:2px 0;text-align:center;flex:1}
.labels button.on{color:var(--cyan);font-weight:700}

.stage>div{width:100%}
.stage>div[hidden]{display:none}
.noise{font-family:monospace;font-size:.8rem;color:#667;line-height:1.5}
.ste{font-size:1.1rem;line-height:1.9;color:var(--cyan);font-weight:500}
.nodes{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}
.node{padding:8px 16px;border-radius:6px;border:1px solid}
.playbtn{margin-top:14px;background:transparent;border:1px solid var(--purple);color:var(--purple);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem}
.playbtn:hover{background:var(--purple);color:#000}
canvas{width:100%;max-width:480px;height:130px;background:var(--bg);border-radius:8px;border:1px solid var(--border);display:block;margin:8px auto}
.ent{display:flex;align-items:center;justify-content:center;gap:10px;font-size:.8rem;color:var(--sub)}
.ent input{width:160px;margin:0}
.vid{width:90px;height:50px;background:#1a1f2b;border-radius:6px;border:1px solid var(--purple);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:var(--purple);font-size:1.3rem}
.sup{color:var(--cyan);font-size:.95rem;font-weight:500}
.mm{margin-bottom:18px}
.mm h3{font-size:.9rem;color:var(--sub);margin-bottom:8px;font-weight:600}
.mermaid{display:flex;justify-content:center;overflow-x:auto}
pre{background:#0f1218;padding:15px;border-radius:12px;border:1px solid var(--border);overflow:auto;max-height:420px;color:#a9b7c6;font:.78rem/1.45 ui-monospace,Menlo,Consolas,monospace}
h4{margin:14px 0 6px;font-size:.85rem;color:var(--cyan)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.card{margin-top:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:#0f1218;text-align:left;font-size:.85rem;line-height:1.6}
.card h3{font-size:1.05rem;margin-bottom:4px}
.card .def{color:var(--text);margin-bottom:8px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;color:var(--sub)}
.card dt{white-space:nowrap}
.card dd{color:var(--text)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid;font-size:.75rem;margin-right:6px}
.src{margin-top:10px;font-size:.72rem;color:var(--sub)}
svg.viz{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
svg text{font-family:inherit}
.path{cursor:pointer;transition:opacity .25s}.path:focus-visible{outline:2px solid var(--purple)}
.cols{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.cols .arr{color:var(--purple);font-size:1.4rem}
.mini{max-width:210px;font-size:.72rem;color:#667;font-family:monospace;line-height:1.5;text-align:left}

</style>

e-width:2px,color:#ffffff", "scenes": "flowchart TD\n    N0[\"L1 · Information Overload<br/>Overload: 45 random text fragments\"]:::gray\n    N1[\"L1 · Text Reduction<br/>Collapse to a point → three core statements\"]:::cyan\n    N2[\"L1 · Structure Diagram<br/>Converted to a node-and-arrow graph\"]:::cyan\n    N3[\"L2 · Operable Interface<br/>Browser window + slider drag\"]:::cyan\n    N4[\"L3 · Meaning Placement<br/>Scattered nodes settle into the direction·value·boundary triangle\"]:::purple\n    N5[\"L4 · Evidence Rings<br/>Each node gets an evidence ring (illustrative)\"]:::purple\n    N6[\"L5 · Path Selection<br/>Three candidate paths: two fade, one is highlighted\"]:::amber\n    N7[\"L6 · Recursive Spiral<br/>Spiral returns to a higher start L1′ at the same angle; the eye reviews the whole loop\"]:::amber\n    N8[\"Meaning Intelligence<br/>Gradient title card\"]:::white\n    N0 --> N1 --> N2 --> N3 --> N4 --> N5 --> N6 --> N7 --> N8\n    classDef gray fill:#141820,stroke:#8b95a5,stroke-dasharray:4 3,color:#8b95a5\n    classDef cyan fill:#0a1a20,stroke:#00e5ff,color:#00e5ff\n    classDef purple fill:#150e26,stroke:#bb86fc,color:#bb86fc\n    classDef amber fill:#241c08,stroke:#ffd166,color:#ffd166\n    classDef white fill:#0a0c10,stroke:#ffffff,stroke-width:2px,color:#ffffff", "palette": "flowchart LR\n    P0[\"gray #8b95a5<br/>Noise / raw information\"]:::gray\n    P1[\"cyan #00e5ff<br/>Interface band · L1–L2\"]:::cyan\n    P2[\"purple #bb86fc<br/>Processing band · L3–L4\"]:::purple\n    P3[\"amber #ffd166<br/>Meta band · L5–L6\"]:::amber\n    P4[\"E0 → E6<br/>#5b6472 #ffd166\"]:::white\n    P0 --> P1 --> P2 --> P3 --> P4\n    classDef gray fill:#141820,stroke:#8b95a5,stroke-dasharray:4 3,color:#8b95a5\n    classDef cyan fill:#0a1a20,stroke:#00e5ff,color:#00e5ff\n    classDef purple fill:#150e26,stroke:#bb86fc,color:#bb86fc\n    classDef amber fill:#241c08,stroke:#ffd166,color:#ffd166\n    classDef white fill:#0a0c10,stroke:#ffffff,stroke-width:2px,color:#ffffff"}};
const SRC_PY = "\"\"\"Meaning Intelligence — Manim scene (six-layer stack, 8 acts).\n\nEverything (copy, colours, fonts, timing) comes from config.json.\n\n    manim -qh meaning_intelligence.py MeaningIntelligenceScene     # Chinese\n    MI_LANG=en manim -qh meaning_intelligence.py MeaningIntelligenceScene\n\nActs -> layers:  overload/text/diagram = L1,  interactive = L2,\n                 meaning = L3,  assess = L4,  select = L5,  reflect = L6.\nA measured timeline.json is written next to this file after rendering;\n`python build.py` then uses it for the HTML page's video seeking.\n\"\"\"\nimport json\nimport os\nimport sys\nfrom pathlib import Path\n\n_HERE = Path(__file__).resolve().parent\nsys.path.insert(0, str(_HERE))          # msi/scenes/\nsys.path.insert(0, str(_HERE.parent))   # msi/  <- 这里是 mi_common.py 所在\n\nimport numpy as np\nfrom manim import *\n\nfrom mi_common import HERE, load_config\n\nCFG = load_config()\nLANG = os.environ.get(\"MI_LANG\", CFG[\"default_lang\"])\nif LANG not in CFG[\"languages\"]:\n    raise ValueError(f\"MI_LANG must be one of {CFG['languages']}, got {LANG!r}\")\n\nCOL = CFG[\"colors\"]\nEVID = CFG[\"evidence_scale\"]\nACT = {a[\"id\"]: a for a in CFG[\"acts\"]}\nCONTENT = {k: v[LANG] for k, v in CFG[\"content\"].items()}\n\n\ndef pick_font(candidates):\n    \"\"\"First installed font from the list, else '' (Manim/Pango default).\"\"\"\n    try:\n        import manimpango\n\n        available = set(manimpango.list_fonts())\n    except Exception:\n        return \"\"\n    return next((f for f in candidates if f in available), \"\")\n\n\nUI_FONT = pick_font(CFG[\"fonts\"][\"cjk\" if LANG == \"zh\" else \"latin\"])\nMONO_FONT = pick_font(CFG[\"fonts\"][\"mono\"])\n\n\ndef T(text, font=None, **kw):\n    return Text(text, font=UI_FONT if font is None else font, **kw)\n\n\ndef P3(x, y):\n    return np.array([x, y, 0.0])\n\n\nclass MeaningIntelligenceScene(Scene):\n    # ---------------------------------------------------------------- helpers\n    def mark(self, key):\n        self.timeline[key] = round(float(self.renderer.time), 3)\n\n    def begin(self, act_id):\n        \"\"\"Mark the act's start, and its layer's start if it is the layer's first act.\"\"\"\n        self.mark(act_id)\n        layer = ACT[act_id][\"layer\"]\n        if layer not in self.timeline:\n            self.mark(layer)\n        return ACT[act_id]\n\n    def make_noise(self):\n        rng = np.random.default_rng(CFG[\"overload\"][\"seed\"])\n        group = VGroup()\n        for _ in range(CFG[\"overload\"][\"count\"]):\n            t = T(\"info. \" * 3, font=MONO_FONT, font_size=11, color=COL[\"gray\"])\n            t.move_to([rng.uniform(-6.5, 6.5), rng.uniform(-3.5, 3.5), 0])\n            t.set_opacity(rng.uniform(0.3, 0.8))\n            group.add(t)\n        return group\n\n    def make_node(self, text, color):\n        box = RoundedRectangle(corner_radius=0.15, height=0.9, width=3.0, color=color)\n        box.set_fill(COL[\"fill_gray\"], opacity=0.9)\n        return VGroup(box, T(text, font_size=18, color=color).move_to(box))\n\n    def make_eye(self, scale=1.0):\n        c = COL[\"cyan\"]\n        outline = Ellipse(width=2.4 * scale, height=1.1 * scale, color=c)\n        pupil = Circle(radius=0.32 * scale, color=c).set_fill(c, opacity=0.95)\n        glow = Circle(radius=0.45 * scale, color=c).set_fill(c, opacity=0.25)\n        return VGroup(outline, glow, pupil), pupil, glow\n\n    # -------------------------------------------------------------- construct\n    def construct(self):\n        self.camera.background_color = COL[\"bg\"]\n        self.timeline = {}\n        cyan, purple, amber, gray = COL[\"cyan\"], COL[\"purple\"], COL[\"amber\"], COL[\"gray\"]\n        rng = np.random.default_rng(7)\n\n        # ===== L1 · act 1: information overload ===========================\n        s = self.begin(\"overload\")\n        noise = self.make_noise()\n        self.play(FadeIn(noise), run_time=s[\"enter\"])\n        self.wait(s[\"hold\"])\n\n        # ===== L1 · act 2: gravitational collapse -> 3 core lines ============\n        s = self.begin(\"text\")\n        E = s[\"enter\"]\n        core = Dot(color=cyan).scale(2.8)\n        self.play(\n            LaggedStart(*[t.animate.move_to(ORIGIN).scale(0.05).set_color(cyan) for t in noise],\n                        lag_ratio=0.02),\n            run_time=0.45 * E, rate_func=exponential_decay,\n        )\n        self.play(FadeOut(noise), FadeIn(core, scale=0.3), run_time=0.10 * E)\n        ste = VGroup(*[T(l, font_size=30, color=cyan, weight=BOLD) for l in CONTENT[\"ste_lines\"]]\n                     ).arrange(DOWN, buff=0.45)\n        self.play(FadeOut(core, scale=2),\n                  LaggedStart(*[FadeIn(l, shift=UP * 0.2) for l in ste], lag_ratio=0.3),\n                  run_time=0.45 * E)\n        self.wait(s[\"hold\"])\n\n        # ===== L1 · act 3: structure diagram ================================\n        s = self.begin(\"diagram\")\n        n1 = self.make_node(CONTENT[\"node1\"], cyan)\n        n2 = self.make_node(CONTENT[\"node2\"], purple)\n        n2.next_to(n1, RIGHT, buff=1.6)\n        arrow = Arrow(n1.get_right(), n2.get_left(), buff=0.15, color=WHITE,\n                      max_tip_length_to_length_ratio=0.2)\n        diagram = VGroup(n1, arrow, n2).center()\n        self.play(FadeOut(ste),\n                  LaggedStart(FadeIn(n1), GrowArrow(arrow), FadeIn(n2), lag_ratio=0.4),\n                  run_time=s[\"enter\"])\n        self.wait(s[\"hold\"])\n\n        # ===== L2 · operable interface ======================================\n        s = self.begin(\"interactive\")\n        E = s[\"enter\"]\n        browser = RoundedRectangle(corner_radius=0.2, height=3.2, width=5.8, color=cyan)\n        browser.set_fill(COL[\"fill_gray\"], opacity=0.9)\n        bar = Rectangle(height=0.35, width=5.8, color=cyan).set_fill(cyan, opacity=0.3)\n        bar.align_to(browser, UP)\n        track = Rectangle(height=0.08, width=3.8, color=gray).shift(DOWN * 0.3)\n        knob = Circle(radius=0.16, color=cyan).set_fill(cyan, opacity=1).move_to(track.get_left())\n        browser_group = VGroup(browser, bar, track, knob)\n        self.play(FadeOut(diagram), FadeIn(browser_group), run_time=0.35 * E)\n        self.play(knob.animate.shift(RIGHT * track.width), run_time=0.65 * E, rate_func=smooth)\n        self.wait(s[\"hold\"])\n\n        # ===== L3 · meaning generation: nodes settle into direction·value·boundary\n        s = self.begin(\"meaning\")\n        E = s[\"enter\"]\n        verts = [P3(0, 1.9), P3(-3.0, -1.5), P3(3.0, -1.5)]\n        centroid = sum(verts) / 3\n        starts = [P3(rng.uniform(-3, 3), rng.uniform(-1.6, 1.6)) for _ in range(9)]\n        dots = VGroup(*[Dot(point=p, radius=0.11, color=cyan) for p in starts])\n        targets = []\n        for i in range(9):\n            v = verts[i % 3]\n            ang = (i // 3) * 2.1 + i\n            targets.append(v + (centroid - v) * 0.24 + 0.34 * P3(np.cos(ang), np.sin(ang)))\n        tri = Polygon(*verts, color=purple, stroke_width=3)\n        tri.set_fill(COL[\"fill_purple\"], opacity=0.5)\n        axis_labels = VGroup(\n            T(CONTENT[\"axes\"][0], font_size=24, color=purple, weight=BOLD).next_to(verts[0], UP, buff=0.2),\n            T(CONTENT[\"axes\"][1], font_size=24, color=purple, weight=BOLD).next_to(verts[1], DOWN, buff=0.2),\n            T(CONTENT[\"axes\"][2], font_size=24, color=purple, weight=BOLD).next_to(verts[2], DOWN, buff=0.2),\n        )\n        self.play(FadeOut(browser_group), FadeIn(dots), run_time=0.25 * E)\n        self.play(Create(tri), run_time=0.15 * E)\n        self.play(*[d.animate.move_to(t) for d, t in zip(dots, targets)], run_time=0.40 * E,\n                  rate_func=smooth)\n        self.play(LaggedStart(*[FadeIn(l, shift=UP * 0.1) for l in axis_labels], lag_ratio=0.3),\n                  run_time=0.20 * E)\n        self.wait(s[\"hold\"])\n\n        # ===== L4 · value assessment: evidence rings ==========================\n        s = self.begin(\"assess\")\n        E = s[\"enter\"]\n        rings = VGroup(*[\n            Circle(radius=0.22, color=EVID[lv], stroke_width=4).move_to(t)\n            for lv, t in zip(CFG[\"demo\"][\"assess_levels\"], targets)\n        ])\n        swatches = VGroup(*[Square(side_length=0.3, color=EVID[i]).set_fill(EVID[i], opacity=0.9)\n                            for i in range(7)]).arrange(RIGHT, buff=0.08)\n        e0 = T(\"E0\", font_size=16, color=gray).next_to(swatches, LEFT, buff=0.2)\n        e6 = T(\"E6\", font_size=16, color=gray).next_to(swatches, RIGHT, buff=0.2)\n        note = T(CONTENT[\"illustrative\"], font_size=14, color=gray).next_to(swatches, DOWN, buff=0.15)\n        legend = VGroup(swatches, e0, e6, note).move_to(P3(0, -3.0))\n        self.play(LaggedStart(*[Create(r) for r in rings], lag_ratio=0.1), run_time=0.60 * E)\n        self.play(FadeIn(legend, shift=UP * 0.2), run_time=0.40 * E)\n        self.wait(s[\"hold\"])\n\n        # ===== L5 · direction selection: 3 candidates, 1 survives =============\n        s = self.begin(\"select\")\n        E = s[\"enter\"]\n        old = VGroup(dots, rings, tri, axis_labels, legend)\n        origin_pt = P3(-4.2, 0)\n        ends = [P3(3.6, 1.7), P3(3.6, 0.0), P3(3.6, -1.7)]\n        origin_dot = Dot(point=origin_pt, radius=0.16, color=WHITE)\n        end_dots = VGroup(*[Dot(point=e, radius=0.14, color=amber) for e in ends])\n        end_labels = VGroup(*[T(CONTENT[\"candidates\"][i], font_size=22, color=amber).next_to(ends[i], RIGHT, buff=0.25)\n                              for i in range(3)])\n        paths = VGroup(*[\n            CubicBezier(origin_pt, origin_pt + RIGHT * 3.2, e + LEFT * 3.2, e, color=amber, stroke_width=4)\n            for e in ends\n        ])\n        k = CFG[\"demo\"][\"chosen_path\"]\n        self.play(FadeOut(old), FadeIn(origin_dot), FadeIn(end_dots), FadeIn(end_labels),\n                  run_time=0.30 * E)\n        self.play(LaggedStart(*[Create(p) for p in paths], lag_ratio=0.25), run_time=0.40 * E)\n        fades = [paths[i].animate.set_stroke(opacity=0.15) for i in range(3) if i != k]\n        fades += [end_dots[i].animate.set_opacity(0.2) for i in range(3) if i != k]\n        fades += [end_labels[i].animate.set_opacity(0.2) for i in range(3) if i != k]\n        self.play(*fades,\n                  paths[k].animate.set_stroke(color=cyan, width=8),\n                  end_dots[k].animate.scale(1.5).set_color(cyan),\n                  run_time=0.30 * E)\n        self.wait(s[\"hold\"])\n\n        # ===== L6 · recursive reflection: spiral back to L1' + overseeing eye ==\n        s = self.begin(\"reflect\")\n        E = s[\"enter\"]\n        select_group = VGroup(origin_dot, end_dots, end_labels, paths)\n        center = P3(0, -0.5)\n\n        def spiral_pt(t):  # t in [0, 2*pi]; starts at the top, clockwise, radius grows\n            r = 0.75 + 0.95 * t / TAU\n            a = PI / 2 - t\n            return center + r * P3(np.cos(a), np.sin(a))\n\n        spiral = ParametricFunction(lambda t: spiral_pt(t), t_range=[0, TAU], color=amber, stroke_width=5)\n        markers, labels = VGroup(), VGroup()\n        names = [f\"L{i + 1}\" for i in range(6)] + [\"L1′\"]\n        for i, nm in enumerate(names):\n            p = spiral_pt(i * TAU / 6)\n            out = (p - center) / np.linalg.norm(p - center)\n            markers.add(Dot(point=p, radius=0.09, color=cyan if i < 6 else WHITE))\n            labels.add(T(nm, font_size=18, color=cyan if i < 6 else WHITE).move_to(p + out * 0.38))\n        link = DashedLine(spiral_pt(0), spiral_pt(TAU), color=WHITE, stroke_width=2)\n        eye, pupil, glow = self.make_eye(0.8)\n        eye.move_to(P3(0, 2.9))\n        cap = T(CONTENT[\"supervisor\"], font_size=18, color=cyan, weight=BOLD).move_to(P3(0, -3.35))\n\n        self.play(FadeOut(select_group), run_time=0.15 * E)\n        self.play(Create(spiral), run_time=0.45 * E, rate_func=linear)\n        self.play(LaggedStart(*[FadeIn(VGroup(m, l)) for m, l in zip(markers, labels)], lag_ratio=0.15),\n                  Create(link), run_time=0.20 * E)\n        self.play(FadeIn(eye, shift=DOWN * 0.2), FadeIn(cap), run_time=0.10 * E)\n        self.play(pupil.animate.scale(1.25), glow.animate.scale(1.5).set_opacity(0.4),\n                  run_time=0.10 * E, rate_func=there_and_back)\n        self.wait(s[\"hold\"])\n\n        # ===== finale ==========================================================\n        f = CFG[\"final\"]\n        self.mark(\"final\")\n        title = T(f[\"label\"][LANG], font_size=48, color=WHITE, weight=BOLD)\n        title.set_color_by_gradient(cyan, purple, amber)\n        self.play(FadeOut(*self.mobjects), run_time=0.4 * f[\"enter\"])\n        self.play(FadeIn(title, scale=0.88), run_time=0.6 * f[\"enter\"])\n        self.wait(f[\"hold\"])\n        self.mark(\"end\")\n\n        (HERE / \"timeline.json\").write_text(\n            json.dumps({\"lang\": LANG, \"timeline\": self.timeline}, indent=2), encoding=\"utf-8\")\n";

e:\",\n      \"diagrams\": [\"Six-layer stack\", \"Scene structure\", \"Visual encoding\"],\n      \"card\": {\"band\": \"Band\", \"anchor\": \"Canon anchor\", \"evidence\": \"Evidence level\", \"falsifier\": \"What would falsify it (draft)\"},\n      \"srcPy\": \"meaning_intelligence.py\",\n      \"srcCfg\": \"config.json\"\n    }\n  }\n}\n";

/* ---------- SVG helpers ---------- */
const svg = (id, html) => { $(id).innerHTML = html; };
const dotPositions = () => {                       // 9 nodes settled around the 3 vertices (same rule as the Manim act)
  const V = [[200, 28], [62, 168], [338, 168]], c = [200, 121], out = [];
  for (let i = 0; i < 9; i++) {
    const v = V[i % 3], a = Math.floor(i / 3) * 2.1 + i;
    out.push([v[0] + (c[0] - v[0]) * 0.24 + 15 * Math.cos(a), v[1] + (c[1] - v[1]) * 0.24 + 15 * Math.sin(a)]);

  return { V, pts: out };
};

         `<path d="M${x0} 100 C${x0 + 120} 100 ${x1 - 120} ${y} ${x1} ${y}" fill="none" stroke="transparent" stroke-width="22" pointer-events="stroke"/>` +
         `<circle cx="${x1}" cy="${y}" r="${on ? 9 : 6}" fill="${col}"/>` +
         `<text x="${x1 + 16}" y="${y + 4}" fill="${col}" font-size="13">${esc(cand[i])}</text></g>`;
  });
  svg('svg5', h);
  document.querySelectorAll('#svg5 .path').forEach(g => {
    const pick = () => { chosen = +g.dataset.i; renderPaths(); };
    g.addEventListener('click', pick);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
}

function renderSpiral() {
  const cx = 200, cy = 134, pt = t => { const r = 24 + 46 * t / (2 * Math.PI), a = -Math.PI / 2 + t; return [cx + r * Math.cos(a), cy + r * Math.sin(a), Math.cos(a), Math.sin(a)]; };
  let d = '';
  for (let i = 0; i <= 80; i++) { const p = pt(i / 80 * 2 * Math.PI); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }
  let h = `<path d="${d}" fill="none" stroke="${C.amber}" stroke-width="3"/>`;
  const a = pt(0), b = pt(2 * Math.PI);
  h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#fff" stroke-dasharray="4 3"/>`;
  for (let i = 0; i <= 6; i++) {
    const p = pt(i * 2 * Math.PI / 6), name = i < 6 ? 'L' + (i + 1) : "L1′", col = i < 6 ? C.cyan : '#fff';
    h += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${col}"/><text x="${p[0] + p[2] * 15}" y="${p[1] + p[3] * 15 + 4}" text-anchor="middle" fill="${col}" font-size="11">${name}</text>`;
  }
  h += `<g transform="translate(200 20)"><ellipse rx="24" ry="10" fill="none" stroke="${C.cyan}" stroke-width="2"/><circle r="6" fill="${C.cyan}"/></g>`;
  svg('svg6', h);
}

/* ---------- language ---------- */
function applyLang() {
  const u = ui(), K = CFG.content;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.title = u.title;
  $('title').textContent = u.title; $('subtitle').textContent = u.subtitle; $('langBtn').textContent = u.langBtn;
  u.tabs.forEach((t, i) => $('t' + i).textContent = t);
  LAYERS.forEach((l, i) => { $('lbl' + (i + 1)).textContent = l.id + ' ' + l.name[lang]; });
  $('vdesc').textContent = u.videoDesc + ' · ' + CFG.video.quality;
  $('tlsrc').textContent = u.timelineSrc[TIMELINE_SOURCE];
  $('vmiss').textContent = u.videoMissing;
  $('v1noise').textContent = K.overload_text[lang];
  $('v1ste').replaceChildren(...K.ste_lines[lang].map(l => { const d = document.createElement('div'); d.textContent = l; return d; }));
  $('n1').textContent = K.node1[lang]; $('n1').style.cssText = `color:${C.cyan};border-color:${C.cyan}`;
  $('n2').textContent = K.node2[lang]; $('n2').style.cssText = `color:${C.purple};border-color:${C.purple}`;
  $('hint').textContent = u.canvasHint; $('entLbl').textContent = u.entropy + ':';
  $('pickHint').textContent = u.pickPath; $('recNote').textContent = u.recursion;
  $('playStage').textContent = u.playStage;
  $('srcNote').textContent = CFG.source_note[lang];
  $('srcPyH').textContent = u.srcPy; $('srcCfgH').textContent = u.srcCfg;
  $('srcPy').textContent = SRC_PY; $('srcCfg').textContent = SRC_CFG;
  renderTriangle('svg3', false); renderTriangle('svg4', true); renderPaths(); renderSpiral();
  setStage(stage, true);
  mermaidDirty = true;
  if (tab === 2) renderMermaid();
}

/* ---------- tabs ---------- */
function switchTab(i, focus) {
  tab = i;
  for (let k = 0; k < 4; k++) {
    $('p' + k).hidden = k !== i;
    const b = $('t' + k);
    b.setAttribute('aria-selected', k === i); b.tabIndex = k === i ? 0 : -1;
  }
  if (focus) $('t' + i).focus();
  if (i !== 0) $('video').pause();
  syncCanvas();
  if (i === 2) renderMermaid();
}

/* ---------- layers ---------- */
function setStage(n, silent) {
  stage = n;
  const L = LAYERS[n - 1], B = bandOf(L), u = ui(), col = tierColor(L);
  $('stageSlider').value = n;
  $('stageSlider').setAttribute('aria-valuetext', `${L.id} ${L.name[lang]}`);
  LAYERS.forEach((l, i) => {
    const on = i + 1 === n;
    $('lbl' + (i + 1)).classList.toggle('on', on);
    $('lbl' + (i + 1)).style.color = on ? tierColor(l) : '';
    $('v' + (i + 1)).hidden = !on;
  });
  const row = (k, v) => `<dt>${esc(k)}</dt><dd>${v}</dd>`;
  $('card').innerHTML =
    `<h3 style="color:${col}">${esc(L.id)} · ${esc(L.name[lang])} <span style="color:${C.gray};font-weight:400;font-size:.8rem">${lang === 'zh' ? esc(L.name.en) : esc(L.name.zh)}</span></h3>` +
    `<div class="def">${esc(L.definition[lang])}</div><dl>` +
    row(u.card.band, `<span class="badge" style="color:${col};border-color:${col}">${esc(B.label[lang])}</span>${esc(B.problem[lang])}`) +
    row(u.card.anchor, esc(L.anchor[lang])) +
    row(u.card.evidence, esc(L.evidence)) +
    row(u.card.falsifier, esc(L.falsifier[lang])) + `</dl>`;
  if (!silent) seek(L.id, false);
  syncCanvas();
}

function seek(id, play) {
  const v = $('video'), t = TIMELINE[id];
  if (t === undefined) return;
  const go = () => { v.currentTime = t; if (play) v.play().catch(() => {}); };
  v.readyState > 0 ? go() : v.addEventListener('loadedmetadata', go, { once: true });
}

/* ---------- canvas (L2): particles converge to a grid as entropy -> 0 ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 460, H = 130, parts = [], raf = null;
function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
const CY = hex2rgb(C.cyan), PU = hex2rgb(C.purple);
function setupCanvas() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!r.width) return false;
  W = r.width; H = 130;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const rnd = rng(7); parts = [];
  for (let i = 0; i < 50; i++) parts.push({ bx: rnd() * W, by: rnd() * H, ph: rnd() * 6.28,
    tx: W * (0.1 + 0.8 * (i % 10) / 9), ty: H * (0.15 + 0.7 * Math.floor(i / 10) / 4) });
  return true;
}
function drawCanvas(now) {
  const e = $('entropy').value / 100, k = reduceMotion ? 0 : now * 0.002;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = `rgb(${CY.map((c, j) => Math.round(c + (PU[j] - c) * e))})`;
  parts.forEach(p => {
    const x = p.tx + (p.bx - p.tx) * e + Math.sin(k + p.ph) * 12 * e;
    const y = p.ty + (p.by - p.ty) * e + Math.cos(k + p.ph) * 12 * e;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, 6.2832); ctx.fill();
  });
  cv.setAttribute('aria-label', `${ui().entropy}: ${Math.round(e * 100)}%`);
}
function loop(now) { drawCanvas(now); raf = requestAnimationFrame(loop); }
function syncCanvas() {
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  if (tab !== 1 || stage !== 2) return;
  if (!setupCanvas()) return;
  reduceMotion ? drawCanvas(0) : (raf = requestAnimationFrame(loop));
}
$('entropy').addEventListener('input', () => { if (reduceMotion) drawCanvas(0); });
addEventListener('resize', () => { if (tab === 1) syncCanvas(); });

/* ---------- mermaid (pinned CDN; falls back to source) ---------- */
let mermaidDirty = true;
function renderMermaid() {
  if (!mermaidDirty) return;
  mermaidDirty = false;
  const host = $('mmHost'), u = ui(), ok = !!window.mermaid, nodes = [];
  host.replaceChildren();
  if (!ok) { const p = document.createElement('p'); p.className = 'note warn'; p.textContent = u.mermaidFail; host.appendChild(p); }
  ['pipeline', 'scenes', 'palette'].forEach((k, i) => {
    const wrap = document.createElement('div'); wrap.className = 'mm';
    const h = document.createElement('h3'); h.textContent = u.diagrams[i]; wrap.appendChild(h);
    const box = document.createElement(ok ? 'div' : 'pre'); box.className = ok ? 'box mermaid' : '';
    box.textContent = MERMAID[lang][k]; wrap.appendChild(box); host.appendChild(wrap);
    if (ok) nodes.push(box);
  });
  if (ok) mermaid.run({ nodes }).catch(() => { mermaidDirty = true; });
}
window.addEventListener('load', () => { if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: 'dark' }); if (tab === 2) { mermaidDirty = true; renderMermaid(); } });

applyLang();
switchTab(0);
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js" defer></script>
